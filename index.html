<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="css/styles.css" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to kokoa Clone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="status-bar">
    <div class="status-bar__column">
      <span>No Service</span>
      <i class="fa-solid fa-wifi"></i>
    </div>
    <div class="status-bar__column">
      <span>18:43</span>
    </div>
    <div class="status-bar__column">
      <span>110%</span>
      <i class="fa-solid fa-battery-full fa-lg"></i>
      <i class="fa-solid fa-bolt-lightning"></i>
    </div>
  </div>

  <header class="welcome-header">
    <h1 class="welcome-header__title">Welcome to kokoa Clone</h1>
    <p class="welcome-header__text">
      If you have a Kakao Account, log in with your email or phone number.
    </p>
  </header>

  <form action="friends.html" method="get" class="login-form">
    <input name="username" class="login-form__input" type="text" placeholder="Email or phone number" />
    <input name="password" class="login-form__input" type="password" placeholder="Password" />
    <input class="login-form__btn" type="submit" value="Log In" />
    <input class="login-form__btn" type="submit" value="Sign Up" />
    <a href="#" class="login-form__a">Find Kakao Account or Password</a>
  </form>

</body>
</html>
